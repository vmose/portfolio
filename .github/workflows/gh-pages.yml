# Deploys the static portfolio straight to GitHub Pages.
# No build step: this is a plain HTML/CSS/JS site, so we just
# upload the site folder as-is and let Pages serve it.
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a deploy manually from the Actions tab
  workflow_dispatch:

# Only one deploy at a time; cancel any in-progress run if a new push lands
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # TODO: change "." below if you move the site into a subfolder
      # (e.g. "./site" or "./public"). It should point at the folder
      # that directly contains index.html.
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4